<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181B26"/>
      <stop offset="100%" stop-color="#0E0F14"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7A4E"/>
      <stop offset="100%" stop-color="#ED3F0F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A2E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF5A2E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- faint brand arc, bottom-left -->
  <circle cx="180" cy="920" r="320" fill="none" stroke="#FF5A2E" stroke-opacity="0.15" stroke-width="2"/>
  <circle cx="180" cy="920" r="240" fill="none" stroke="#FF5A2E" stroke-opacity="0.08" stroke-width="2"/>

  <!-- wireframe: header -->
  <rect x="150" y="150" width="620" height="96" rx="26" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <circle cx="212" cy="198" r="22" fill="#FFFFFF" fill-opacity="0.12"/>
  <rect x="260" y="182" width="230" height="13" rx="6.5" fill="#FFFFFF" fill-opacity="0.22"/>
  <rect x="260" y="208" width="150" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.1"/>

  <!-- wireframe: content blocks -->
  <rect x="150" y="286" width="380" height="230" rx="26" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <rect x="190" y="330" width="220" height="13" rx="6.5" fill="#FFFFFF" fill-opacity="0.2"/>
  <rect x="190" y="360" width="300" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.1"/>
  <rect x="190" y="384" width="260" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.1"/>
  <rect x="190" y="408" width="280" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.1"/>
  <rect x="190" y="452" width="120" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.1"/>

  <rect x="570" y="286" width="200" height="230" rx="26" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <rect x="606" y="330" width="128" height="88" rx="16" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="606" y="440" width="90" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.12"/>

  <rect x="150" y="556" width="620" height="96" rx="26" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <rect x="190" y="586" width="180" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.14"/>
  <rect x="190" y="612" width="260" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- the one obvious action -->
  <ellipse cx="1170" cy="470" rx="330" ry="260" fill="url(#glow)"/>
  <rect x="960" y="400" width="420" height="128" rx="64" fill="url(#brand)"/>
  <rect x="1046" y="452" width="200" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.92"/>
  <circle cx="1310" cy="464" r="26" fill="#FFFFFF" fill-opacity="0.25"/>
  <path d="M1300 464h20m0 0-7-7m7 7-7 7" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- cursor -->
  <path d="M1352 560 l0 52 14-12 10 22 12-6 -10-21 18-2 Z" fill="#FFFFFF"/>
  <circle cx="1352" cy="560" r="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>

  <!-- dashed compass circle, top-right -->
  <circle cx="1330" cy="170" r="90" fill="none" stroke="#FF5A2E" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="6 12"/>
  <circle cx="1330" cy="170" r="6" fill="#FF5A2E"/>
</svg>
