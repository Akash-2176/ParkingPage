<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161925"/>
      <stop offset="100%" stop-color="#0E0F14"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7A4E"/>
      <stop offset="100%" stop-color="#ED3F0F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A2E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF5A2E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- ambient constellation -->
  <g stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5">
    <line x1="220" y1="220" x2="470" y2="340"/>
    <line x1="220" y1="220" x2="360" y2="90"/>
    <line x1="470" y1="340" x2="360" y2="90"/>
    <line x1="470" y1="340" x2="420" y2="620"/>
    <line x1="420" y1="620" x2="180" y2="760"/>
    <line x1="420" y1="620" x2="700" y2="800"/>
    <line x1="1240" y1="150" x2="1440" y2="280"/>
    <line x1="1240" y1="150" x2="1060" y2="90"/>
    <line x1="1440" y1="280" x2="1380" y2="700"/>
    <line x1="700" y1="800" x2="1080" y2="860"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.28">
    <circle cx="220" cy="220" r="7"/>
    <circle cx="360" cy="90" r="5"/>
    <circle cx="470" cy="340" r="9"/>
    <circle cx="420" cy="620" r="7"/>
    <circle cx="180" cy="760" r="5"/>
    <circle cx="700" cy="800" r="7"/>
    <circle cx="1080" cy="860" r="5"/>
    <circle cx="1240" cy="150" r="7"/>
    <circle cx="1060" cy="90" r="5"/>
    <circle cx="1440" cy="280" r="6"/>
    <circle cx="1380" cy="700" r="7"/>
  </g>

  <!-- the trusted, cited path -->
  <path d="M320 470 C560 420 720 560 900 520 C1030 490 1090 440 1180 460"
        fill="none" stroke="url(#brand)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="320" cy="470" r="14" fill="url(#brand)"/>
  <circle cx="620" cy="487" r="11" fill="url(#brand)"/>
  <circle cx="900" cy="520" r="11" fill="url(#brand)"/>

  <!-- citation chips along the path -->
  <g>
    <rect x="585" y="410" width="70" height="40" rx="12" fill="#FF5A2E" fill-opacity="0.14" stroke="#FF5A2E" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="607" y="426" width="26" height="8" rx="4" fill="#FF9C77"/>
    <rect x="872" y="570" width="70" height="40" rx="12" fill="#FF5A2E" fill-opacity="0.14" stroke="#FF5A2E" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="894" y="586" width="26" height="8" rx="4" fill="#FF9C77"/>
  </g>

  <!-- verified node -->
  <circle cx="1250" cy="452" r="200" fill="url(#glow)"/>
  <circle cx="1250" cy="452" r="74" fill="url(#brand)"/>
  <circle cx="1250" cy="452" r="98" fill="none" stroke="#FF5A2E" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 10"/>
  <path d="M1218 452 l22 22 44 -46" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
